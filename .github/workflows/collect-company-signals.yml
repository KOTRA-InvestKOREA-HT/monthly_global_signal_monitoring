name: collect-company-signals

# 1단계: 수집 → 판정 → 2차 검증. 보고서 문안과 PDF 는 만들지 않는다.
#
# 판정 호출은 인용·사유·판정만 쓴다. 문안은 publish-report 워크플로(2단계)가 판정을 이어받아 쓰고
# 한·영 PDF 를 만들어 커밋한다. 두 단계를 다른 날 돌려 무료 등급의 하루 한도를 나눠 쓴다.
# 할당량으로 멈추면 진행 상황이 캐시에 남으므로, 같은 기간으로 다시 돌리면 이어서 판정한다.
# 대시보드 버튼(app/api/trigger-crawl)은 이 파일을 auto_publish=true 로 실행한다. 판정이 끝나면 마지막 단계가
# publish-report 를 같은 기간·호수로 실행해 버튼 한 번으로 PDF 까지 나온다. 수동 실행은 기본값(false)이라 판정만 한다.

run-name: "collect ${{ inputs.from_date || 'previous month' }} ${{ inputs.to_date }}${{ inputs.auto_publish && ' + publish' || '' }}"

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Legacy input for dashboard compatibility; monthly from_date/to_date take precedence"
        required: false
        default: "45"
      from_date:
        description: "Collection start date (YYYY-MM-DD); leave empty for previous calendar month"
        required: false
        default: ""
      to_date:
        description: "Collection end date (YYYY-MM-DD); leave empty for previous calendar month"
        required: false
        default: ""
      issue_number:
        description: "Report issue number, recorded for publish-report (it can also be set there)"
        required: false
        default: "2"

      provider:
        description: "Review provider"
        type: choice
        options: [gemini, nvidia]
        default: gemini
      max_requests:
        description: "Maximum API requests including retries (1-600)"
        type: string
        default: "600"
      delay_ms:
        description: "Delay between requests in ms. Leave empty for the provider default (gemini 4500, nvidia 1600)"
        type: string
        default: ""
      refresh:
        description: "Recollect sources instead of resuming the saved collection"
        type: boolean
        default: false
      rereview:
        description: "Discard saved AI reviews and review every article again. If the run pauses, run again with this off"
        type: boolean
        default: false
      concurrency:
        description: "Concurrent article requests (1-12); shared RPM limit still applies"
        type: string
        default: "4"
      auto_publish:
        description: "Run publish-report for the same dates when the judgement finishes (the dashboard button turns this on)"
        type: boolean
        default: false

# publish-report 와 같은 그룹이다. 두 단계가 같은 진행 캐시를 동시에 고쳐 쓰지 않게 한다.
concurrency:
  group: monthly-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # auto_publish 일 때 publish-report 를 실행한다.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-python.txt
      - name: Resolve reporting period
        id: report_period
        env:
          REPORT_FROM_DATE: ${{ inputs.from_date }}
          REPORT_TO_DATE: ${{ inputs.to_date }}
        run: node scripts/report_period.mjs --github-output
      - name: Restore review progress
        uses: actions/cache/restore@v5
        with:
          path: outputs/review_work
          key: review-v1-${{ github.ref_name }}-${{ steps.report_period.outputs.from_date }}-${{ steps.report_period.outputs.to_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            review-v1-${{ github.ref_name }}-${{ steps.report_period.outputs.from_date }}-${{ steps.report_period.outputs.to_date }}-
      - name: Collect and judge articles
        id: review
        env:
          REPORT_PROVIDER: ${{ inputs.provider || vars.REPORT_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # API 가 무료 티어를 강제하지 못한다. 저장소 변수로 사람이 확인했다는 표시를 남긴다.
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
          # 비워 두면 코드 기본값(high)을 쓴다. minimal, low, medium, high 중 하나.
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL }}
          # 2차 검증: 규칙이 고른 의심 후보만 이 모델로 다시 판정한다. 비워 두면 gemini-3.5-flash-lite(1차와 같은 모델, 검증 질문 방식만 다름). off 로 끈다.
          GEMINI_VERIFIER_MODEL: ${{ vars.GEMINI_VERIFIER_MODEL }}
          REVIEW_VERIFIER: ${{ vars.REVIEW_VERIFIER }}
          # 이름은 OPENAI_API_KEY 지만 내용은 NVIDIA build 키다.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_MAX_REQUESTS: ${{ inputs.max_requests || vars.REPORT_MAX_REQUESTS || '600' }}
          REPORT_DELAY_MS: ${{ inputs.delay_ms || vars.REPORT_DELAY_MS || '' }}
          REPORT_CONCURRENCY: ${{ inputs.concurrency || vars.REPORT_CONCURRENCY || '4' }}
          REPORT_FROM_DATE: ${{ steps.report_period.outputs.from_date }}
          REPORT_TO_DATE: ${{ steps.report_period.outputs.to_date }}
          REPORT_ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
          REPORT_REFRESH: ${{ inputs.refresh || 'false' }}
          REPORT_REREVIEW: ${{ inputs.rereview || 'false' }}
          # SEC EDGAR 는 연락처가 든 User-Agent 를 요구한다(예: "KOTRA Invest KOREA signal monitor team@example.org").
          # 저장소 변수를 비워 두면 8-K 수집만 건너뛴다.
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        # 종료 코드 75 는 한도·제공자 오류로 멈춘 것이다. 같은 기간으로 다시 돌리면 이어서 판정한다.
        # 여기서는 넘기고 아래 "Paused" 단계가 실행을 실패로 끝낸다. 대시보드는 그 단계 이름으로 일시정지와 오류를 가른다.
        run: |
          code=0
          node scripts/review_report.mjs || code=$?
          if [ "$code" -eq 75 ]; then echo "paused=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit "$code"
      - name: Save review progress even when quota is exhausted
        if: ${{ always() && steps.review.outcome != 'skipped' }}
        uses: actions/cache/save@v5
        with:
          path: outputs/review_work
          key: review-v1-${{ github.ref_name }}-${{ steps.report_period.outputs.from_date }}-${{ steps.report_period.outputs.to_date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload progress and results for inspection
        if: ${{ always() && steps.review.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: article-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/review_work
          retention-days: 30
          if-no-files-found: ignore
      # 이름을 바꾸면 app/lib/report_pipeline.mjs 의 PAUSED_STEP 도 바꾼다. 대시보드가 이 이름으로 일시정지를 알아본다.
      - name: Paused - run again to resume
        if: ${{ steps.review.outputs.paused == 'true' }}
        run: |
          echo "::warning::The judgement stopped before finishing (quota or provider error). Run again for the same dates to resume."
          exit 75
      # 판정이 끝났을 때만 여기까지 온다(앞 단계가 실패하면 건너뛴다).
      # GITHUB_TOKEN 이 만든 이벤트는 다른 워크플로를 시작하지 않지만 workflow_dispatch 는 예외다.
      # 두 워크플로가 같은 동시 실행 그룹이라 발행은 이 실행이 진행 캐시를 저장하고 끝난 뒤에 시작한다.
      - name: Start publish-report for the finished judgement
        if: ${{ inputs.auto_publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FROM_DATE: ${{ steps.report_period.outputs.from_date }}
          TO_DATE: ${{ steps.report_period.outputs.to_date }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: >-
          gh workflow run publish-report.yml --ref "$GITHUB_REF_NAME"
          -f from_date="$FROM_DATE" -f to_date="$TO_DATE" -f issue_number="$ISSUE_NUMBER"
