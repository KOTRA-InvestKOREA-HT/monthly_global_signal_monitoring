name: collect-company-signals

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "45"

concurrency:
  group: collect-company-signals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-python.txt
      - run: >
          node scripts/collect_company_signals.mjs
          --companies data/target_companies.json
          --source-config config/company_sources.json
          --out-dir outputs
          --sources official_feeds,official_pages,google_news
          --days ${{ inputs.days || '45' }}
          --max-per-source 6
          --max-per-company 10
          --max-detail-per-company 10
          --fallback-mode missing
          --fallback-min-results 1
          --rate-limit-seconds 0.5
          --company-concurrency 4
      - run: >
          node scripts/filter_relevant_signals.mjs
          --signals outputs/latest_company_signals.json
          --technology-map data/company_technology_map.json
          --keyword-config config/technology_keywords.json
          --out-dir outputs
          --threshold 1
      - run: >
          node scripts/classify_investment_signals.mjs
          --signals outputs/latest_company_signals.json
          --technology-classification outputs/latest_signal_relevance_classification.json
          --indicator-config config/investment_signal_indicators.json
          --out-dir outputs
          --threshold 4
          --require-technology-relevance true
      - run: >
          python scripts/build_pdf_report.py
          --signals outputs/latest_company_signals.json
          --summary outputs/latest_collection_summary.json
          --relevant outputs/latest_relevant_signals.json
          --relevance-summary outputs/latest_relevance_summary.json
          --investment-signals outputs/latest_investment_signals.json
          --investment-summary outputs/latest_investment_signal_summary.json
          --indicator-config config/investment_signal_indicators.json
          --font assets/fonts/NOTOSANSKR-VF.TTF
          --out public/reports/latest_report.pdf
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update company signal data and signal filters"
          file_pattern: outputs/*.json outputs/*.csv public/reports/latest_report.pdf
