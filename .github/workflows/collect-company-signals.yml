name: collect-company-signals

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Fallback lookback window in days"
        required: false
        default: "45"
      from_date:
        description: "Collection start date (YYYY-MM-DD); leave empty for previous calendar month"
        required: false
        default: ""
      to_date:
        description: "Collection end date (YYYY-MM-DD); leave empty for previous calendar month"
        required: false
        default: ""
      issue_number:
        description: "Report issue number"
        required: false
        default: "2"

concurrency:
  group: collect-company-signals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-python.txt
      - name: Resolve reporting period
        id: report_period
        shell: bash
        env:
          INPUT_FROM_DATE: ${{ inputs.from_date }}
          INPUT_TO_DATE: ${{ inputs.to_date }}
          TZ: Asia/Seoul
        run: |
          if [[ -n "$INPUT_FROM_DATE" || -n "$INPUT_TO_DATE" ]]; then
            if [[ -z "$INPUT_FROM_DATE" || -z "$INPUT_TO_DATE" ]]; then
              echo "from_date and to_date must be supplied together" >&2
              exit 1
            fi
            from_date="$INPUT_FROM_DATE"
            to_date="$INPUT_TO_DATE"
          else
            current_month_start="$(date +%Y-%m-01)"
            from_date="$(date -d "$current_month_start -1 month" +%F)"
            to_date="$(date -d "$current_month_start -1 day" +%F)"
          fi

          if [[ "$(date -d "$from_date" +%F 2>/dev/null)" != "$from_date" ]] ||
             [[ "$(date -d "$to_date" +%F 2>/dev/null)" != "$to_date" ]] ||
             [[ "$from_date" > "$to_date" ]]; then
            echo "invalid reporting period: $from_date .. $to_date" >&2
            exit 1
          fi

          echo "from_date=$from_date" >> "$GITHUB_OUTPUT"
          echo "to_date=$to_date" >> "$GITHUB_OUTPUT"
          echo "Reporting period: $from_date .. $to_date"
      - run: >
          node scripts/collect_company_signals.mjs
          --companies data/target_companies.json
          --source-config config/company_sources.json
          --out-dir outputs
          --sources official_feeds,official_pages,google_news
          --days ${{ inputs.days || '45' }}
          --from-date ${{ steps.report_period.outputs.from_date }}
          --to-date ${{ steps.report_period.outputs.to_date }}
          --max-per-source 6
          --max-per-company 10
          --max-detail-per-company 10
          --fallback-mode missing
          --fallback-min-results 1
          --rate-limit-seconds 0.5
          --company-concurrency 4
      - run: >
          node scripts/filter_relevant_signals.mjs
          --signals outputs/latest_company_signals.json
          --technology-map data/company_technology_map.json
          --keyword-config config/technology_keywords.json
          --out-dir outputs
          --threshold 1
      - run: >
          node scripts/classify_investment_signals.mjs
          --signals outputs/latest_company_signals.json
          --technology-classification outputs/latest_signal_relevance_classification.json
          --indicator-config config/investment_signal_indicators.json
          --out-dir outputs
          --threshold 4
          --require-technology-relevance true
      - run: >
          node scripts/summarize_signal_evidence.mjs
          --investment-signals outputs/latest_investment_signals.json
          --relevant-signals outputs/latest_relevant_signals.json
          --out-dir outputs
          --optional false
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_SUMMARY_LUNA_MODEL: ${{ vars.AI_SUMMARY_LUNA_MODEL || 'gpt-5.6-luna' }}
          AI_SUMMARY_TERRA_MODEL: ${{ vars.AI_SUMMARY_TERRA_MODEL || 'gpt-5.6-terra' }}
          AI_SUMMARY_REASONING_EFFORT: ${{ vars.AI_SUMMARY_REASONING_EFFORT || 'low' }}
          AI_SUMMARY_MAX_OUTPUT_TOKENS: ${{ vars.AI_SUMMARY_MAX_OUTPUT_TOKENS || '1600' }}
          AI_SUMMARY_RETRY_MAX_OUTPUT_TOKENS: ${{ vars.AI_SUMMARY_RETRY_MAX_OUTPUT_TOKENS || '3200' }}
          AI_SUMMARY_RELEVANT_SIGNALS: ${{ vars.AI_SUMMARY_RELEVANT_SIGNALS || 'true' }}
      - name: Validate report inputs (fail closed)
        run: node scripts/validate_report_inputs.mjs
      - run: >
          python scripts/build_pdf_report.py
          --signals outputs/latest_company_signals.json
          --summary outputs/latest_collection_summary.json
          --relevant outputs/latest_relevant_signals.json
          --relevance-summary outputs/latest_relevance_summary.json
          --investment-signals outputs/latest_investment_signals.json
          --investment-summary outputs/latest_investment_signal_summary.json
          --indicator-config config/investment_signal_indicators.json
          --font assets/fonts/NOTOSANSKR-VF.TTF
          --issue-number ${{ inputs.issue_number || '2' }}
          --lang ko
          --out public/reports/latest_report.pdf
      - name: Build English report
        run: >
          python scripts/build_pdf_report.py
          --signals outputs/latest_company_signals.json
          --summary outputs/latest_collection_summary.json
          --relevant outputs/latest_relevant_signals.json
          --relevance-summary outputs/latest_relevance_summary.json
          --investment-signals outputs/latest_investment_signals.json
          --investment-summary outputs/latest_investment_signal_summary.json
          --indicator-config config/investment_signal_indicators.json
          --font assets/fonts/NOTOSANSKR-VF.TTF
          --issue-number ${{ inputs.issue_number || '2' }}
          --lang en
          --out public/reports/latest_report_en.pdf
      - name: Sync latest main before committing generated outputs
        run: git pull --rebase --autostash origin main
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update company signal data and signal filters"
          file_pattern: outputs/latest_*.json outputs/latest_*.csv outputs/ai_summary_cache.json public/reports/latest_report.pdf public/reports/latest_report_en.pdf
