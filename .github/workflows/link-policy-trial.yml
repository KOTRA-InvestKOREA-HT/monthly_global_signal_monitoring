name: link-policy-trial

# 링크 판정 규칙을 바꾸기 전에 수집만 돌려보는 경로.
#
# collect-company-signals 는 수집과 AI 검토가 한 덩어리라, 규칙 하나 바꿔보려고 돌리면
# 검토 요청 400건이 같이 나간다. 여기서는 수집기와 감사 도구만 돌리고 결과를 아티팩트로
# 올린다. AI 는 부르지 않고 outputs/ 도 커밋하지 않는다.
#
# 수집 기본값은 link_policy=proposed 다(운영 수집도 이 규칙을 쓴다). current 는 proposed 도입 전 규칙으로,
# 비교 기준으로만 남아 있다. 같은 기간으로 둘을 한 번씩 돌려 두 아티팩트를 비교하면 회수량과 소음 증가량이 나온다.
# 수집 인자는 운영 판정과 같은 scripts/collection_args.mjs 를 쓰고, 이 화면에서 고른 값만 덮어쓴다.
on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Collection start date (YYYY-MM-DD); leave empty for previous calendar month"
        required: false
        default: ""
      to_date:
        description: "Collection end date (YYYY-MM-DD); leave empty for previous calendar month"
        required: false
        default: ""
      link_policy:
        description: "Link rule: proposed is the production rule; current is the older comparison baseline"
        type: choice
        options: [current, proposed]
        default: proposed
      max_verify_per_company:
        description: "Uncertain links per company that may be fetched to decide (proposed only)"
        type: string
        default: "0"
      company_limit:
        description: "Companies to collect; 0 means all 77"
        type: string
        default: "0"
      refresh:
        description: "Recollect completed companies instead of reusing progress (up to 24 hours)"
        type: boolean
        default: false
      run_audit:
        description: "Also run the three-rule shadow audit over the listing pages"
        type: boolean
        default: true

concurrency:
  group: link-policy-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trial:
    runs-on: ubuntu-latest
    # 아무것도 커밋하지 않는다. 이 워크플로는 읽고 재기만 한다.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 수집기가 PDF 본문을 뽑을 때 python 을 부른다. 이게 없으면 PDF 기사가 본문 없이
      # 남아 두 정책의 비교가 어긋난다.
      - run: python -m pip install -r requirements-python.txt
      # 자유 입력은 run: 에 직접 넣지 않고 환경 변수로만 넘긴다(스크립트 주입 방지). 숫자 입력은 여기서 검사한다.
      # 비워 두면 0 이다. 예전에는 빈 company_limit 이 다음 플래그(--link-policy)를 값으로 삼켰다.
      - name: Check trial inputs
        id: trial_inputs
        shell: bash
        env:
          INPUT_COMPANY_LIMIT: ${{ inputs.company_limit }}
          INPUT_MAX_VERIFY: ${{ inputs.max_verify_per_company }}
          INPUT_LINK_POLICY: ${{ inputs.link_policy }}
        run: |
          company_limit="${INPUT_COMPANY_LIMIT:-0}"
          max_verify="${INPUT_MAX_VERIFY:-0}"
          if [[ ! "$company_limit" =~ ^[0-9]{1,3}$ ]]; then
            echo "company_limit must be a whole number (0 means all companies)" >&2
            exit 1
          fi
          if [[ ! "$max_verify" =~ ^[0-9]{1,3}$ ]]; then
            echo "max_verify_per_company must be a whole number" >&2
            exit 1
          fi
          if [[ "$INPUT_LINK_POLICY" != "current" && "$INPUT_LINK_POLICY" != "proposed" ]]; then
            echo "link_policy must be current or proposed" >&2
            exit 1
          fi
          echo "company_limit=$company_limit" >> "$GITHUB_OUTPUT"
          echo "max_verify=$max_verify" >> "$GITHUB_OUTPUT"
      # 다른 워크플로와 같은 기간 계산을 쓴다. 비우면 한국 시간 기준 전월이다.
      - name: Resolve reporting period
        id: report_period
        env:
          REPORT_FROM_DATE: ${{ inputs.from_date }}
          REPORT_TO_DATE: ${{ inputs.to_date }}
        run: node scripts/report_period.mjs --github-output
      - name: Restore company collection progress
        uses: actions/cache/restore@v5
        with:
          path: outputs/link_trial/company_progress
          key: company-progress-${{ github.ref_name }}-${{ steps.report_period.outputs.from_date }}-${{ steps.report_period.outputs.to_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            company-progress-${{ github.ref_name }}-${{ steps.report_period.outputs.from_date }}-${{ steps.report_period.outputs.to_date }}-
      - name: Collect
        env:
          FROM_DATE: ${{ steps.report_period.outputs.from_date }}
          TO_DATE: ${{ steps.report_period.outputs.to_date }}
          COMPANY_LIMIT: ${{ steps.trial_inputs.outputs.company_limit }}
          MAX_VERIFY: ${{ steps.trial_inputs.outputs.max_verify }}
          LINK_POLICY: ${{ inputs.link_policy }}
          REFRESH: ${{ inputs.refresh }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: >
          node scripts/collection_args.mjs
          --out-dir outputs/link_trial
          --from-date "$FROM_DATE"
          --to-date "$TO_DATE"
          --company-limit "$COMPANY_LIMIT"
          --link-policy "$LINK_POLICY"
          --max-verify-per-company "$MAX_VERIFY"
          --refresh "$REFRESH"
      - name: Save company collection progress
        if: always()
        uses: actions/cache/save@v5
        with:
          path: outputs/link_trial/company_progress
          key: company-progress-${{ github.ref_name }}-${{ steps.report_period.outputs.from_date }}-${{ steps.report_period.outputs.to_date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Shadow audit over the listing pages
        if: ${{ inputs.run_audit }}
        run: >
          node scripts/audit_link_rules.mjs
          --out-dir outputs/link_trial/audit
          --cache-dir outputs/link_trial/cache
          --per-company 2
      - name: Headline numbers
        if: ${{ always() }}
        shell: bash
        env:
          LINK_POLICY: ${{ inputs.link_policy }}
        run: |
          summary=outputs/link_trial/latest_collection_summary.json
          [[ -f "$summary" ]] || exit 0
          {
            echo "### link_policy=$LINK_POLICY"
            echo '```'
            node -e '
              const s = require("./" + process.argv[1]);
              const keep = ["link_policy", "result_count", "official_result_count",
                "press_release_result_count", "request_count", "undated_result_count",
                "excluded_non_article_count", "link_verdict_counts",
                "excluded_non_article_reasons", "date_status_counts"];
              for (const key of keep) console.log(key + ": " + JSON.stringify(s[key]));
            ' "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # 캐시는 감사 도구가 목록 페이지 HTML을 담아둔 것이라 아티팩트에 넣지 않는다.
      - name: Upload the collection and the audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: link-policy-${{ inputs.link_policy }}-${{ github.run_id }}
          path: |
            outputs/link_trial
            !outputs/link_trial/cache
          retention-days: 14
          if-no-files-found: warn
