name: publish-report

# 2단계: collect-company-signals 가 끝낸 판정을 이어받아 보고서 문안을 쓰고 한·영 PDF 를 만든다.
#
# 판정과 같은 기간으로 실행한다(비워 두면 둘 다 지난달). 판정이 끝나지 않았으면 문안을 쓰지 않고 멈춘다.
# 문안 모델(gemini-3.5-flash-lite)이 할당량으로 멈추면 쓴 문안은 캐시에 남으므로, 같은 기간으로 다시 돌리면 이어서 쓴다.
# 두 PDF 가 모두 만들어졌을 때만 outputs/latest_*.json 과 PDF 를 커밋한다.
# 대시보드 버튼으로 시작한 collect-company-signals 는 판정이 끝나면 이 워크플로를 실행한다. 대시보드의
# "발행만 실행" 버튼과 수동 실행은 이 워크플로만 돌린다.

run-name: "publish ${{ inputs.from_date || 'previous month' }} ${{ inputs.to_date }}"

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Report start date (YYYY-MM-DD); leave empty for previous calendar month. Must match the judgement run"
        required: false
        default: ""
      to_date:
        description: "Report end date (YYYY-MM-DD); leave empty for previous calendar month. Must match the judgement run"
        required: false
        default: ""
      issue_number:
        description: "Report issue number; leave empty to use the one given to collect-company-signals"
        required: false
        default: ""

# collect-company-signals 와 같은 그룹이다. 두 단계가 같은 진행 캐시를 동시에 고쳐 쓰지 않게 한다.
concurrency:
  group: monthly-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 기본값 360분이면 멈춘 실행이 collect-company-signals 와 같이 쓰는 동시 실행 그룹을 6시간 막는다.
    # 지난 발행은 문안·검토 호출 약 221건에 17분, PDF 두 개에 1분이 안 걸렸다.
    # 문안 단계에 45분을 주고, 진행 저장·업로드·커밋이 돌 시간을 더해 60분에서 끊는다.
    timeout-minutes: 60
    permissions:
      contents: write
    # 커밋하는 결과 파일. 아래 main 맞추기 단계와 커밋 단계가 같은 목록을 쓴다.
    env:
      REPORT_COMMIT_FILES: outputs/latest_*.json public/reports/latest_report.pdf public/reports/latest_report_en.pdf
    steps:
      # 기록은 쓰지 않는다(스크립트에 git 호출이 없다). 마지막 커밋만 받고, 커밋 직전에 main 의 마지막 커밋을 다시 받는다.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # 받은 패키지를 실행 사이에 재사용한다. 설치하는 파일이 바뀌면 캐시 열쇠도 바뀐다.
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-python.txt
      - name: Resolve reporting period
        id: report_period
        env:
          REPORT_FROM_DATE: ${{ inputs.from_date }}
          REPORT_TO_DATE: ${{ inputs.to_date }}
        run: node scripts/report_period.mjs --github-output
      # 판정 단계가 저장한 진행 상황(status.json·스냅샷·판정 파일)을 같은 열쇠 접두사로 받는다.
      - name: Restore judgement
        uses: actions/cache/restore@v5
        with:
          path: outputs/review_work
          key: review-v1-${{ github.ref_name }}-${{ steps.report_period.outputs.from_date }}-${{ steps.report_period.outputs.to_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            review-v1-${{ github.ref_name }}-${{ steps.report_period.outputs.from_date }}-${{ steps.report_period.outputs.to_date }}-
      - name: Write report copy and build both PDFs
        id: publish
        # 문안 단계가 먼저 끊겨야 아래 진행 저장이 작업 제한 시간 안에서 평소처럼 돈다(이 단계는 실패로 끝난다).
        timeout-minutes: 45
        env:
          # 문안 단계 전용 키. 판정 단계(GEMINI_API_KEY)와 무료 한도를 나눠 쓰지 않는다. 비어 있으면 GEMINI_API_KEY 를 쓴다.
          GEMINI_FOR_SUMMARY: ${{ secrets.GEMINI_FOR_SUMMARY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # API 가 무료 티어를 강제하지 못한다. 저장소 변수로 사람이 확인했다는 표시를 남긴다. 두 키 모두에 해당한다.
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
          # 비워 두면 gemini-3.5-flash-lite. 문안 검사에 걸리면 걸린 이유를 알려 주며 최대 세 번까지 다시 쓰게 한다.
          GEMINI_WRITER_MODEL: ${{ vars.GEMINI_WRITER_MODEL }}
          GEMINI_WRITER_THINKING_LEVEL: ${{ vars.GEMINI_WRITER_THINKING_LEVEL }}
          # 비워 두면 코드 기본값. 문안 요청 하나를 기다리는 시간(10000..600000ms).
          GEMINI_WRITER_TIMEOUT_MS: ${{ vars.GEMINI_WRITER_TIMEOUT_MS }}
          # 문안 검토 모델. 비워 두면 gemini-3.5-flash-lite, off 로 끈다(README 안내).
          GEMINI_REVIEWER_MODEL: ${{ vars.GEMINI_REVIEWER_MODEL }}
          GEMINI_REVIEWER_THINKING_LEVEL: ${{ vars.GEMINI_REVIEWER_THINKING_LEVEL }}
          # 문안·검토 단계가 함께 기다리는 요청 수. 판정 단계와 같은 변수이고, 비워 두면 4.
          REPORT_CONCURRENCY: ${{ vars.REPORT_CONCURRENCY || '4' }}
          REPORT_FROM_DATE: ${{ steps.report_period.outputs.from_date }}
          REPORT_TO_DATE: ${{ steps.report_period.outputs.to_date }}
          REPORT_ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
        # 종료 코드 75 는 문안 모델이 한도로 멈춘 것이다. 아래 "Paused" 단계가 실행을 실패로 끝낸다(collect-company-signals 와 같다).
        run: |
          code=0
          node scripts/publish_report.mjs || code=$?
          if [ "$code" -eq 75 ]; then echo "paused=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit "$code"
      - name: Save progress even when quota is exhausted
        if: ${{ always() && steps.publish.outcome != 'skipped' }}
        uses: actions/cache/save@v5
        with:
          path: outputs/review_work
          key: review-v1-${{ github.ref_name }}-${{ steps.report_period.outputs.from_date }}-${{ steps.report_period.outputs.to_date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload progress and results for inspection
        if: ${{ always() && steps.publish.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: report-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/review_work
          retention-days: 30
          if-no-files-found: ignore
      # 멈췄으면 여기서 실행을 끝내 아래 검증·PDF 업로드·커밋을 건너뛴다. 이름은 app/lib/report_pipeline.mjs 의 PAUSED_STEP 과 같다.
      - name: Paused - run again to resume
        if: ${{ steps.publish.outputs.paused == 'true' }}
        run: |
          echo "::warning::Writing the report copy stopped before finishing (quota). Run publish-report again for the same dates to resume."
          exit 75
      - name: Validate report inputs
        run: node scripts/validate_report_inputs.mjs
      - name: Downloadable bilingual PDFs
        uses: actions/upload-artifact@v6
        with:
          name: monthly-report-pdfs-${{ github.run_id }}
          path: public/reports/latest_report*.pdf
          retention-days: 30
      # 판정부터 발행까지 한 시간 남짓 도는 사이 main 에 다른 커밋이 올라오면(10/12 에 다섯 번) 아래 push 가
      # fast-forward 가 아니라 거절되고 단계 전체를 다시 돌려야 했다. 커밋 직전에 main 의 마지막 커밋으로 옮긴다.
      # 아직 커밋 전이라 rebase 가 아니라 "새 main 을 받아 결과 파일만 얹기"다. 얕은 체크아웃에는 공통 조상이 없어
      # rebase·merge 가 실패할 수 있지만, 여기서 쓰는 것은 두 커밋의 트리 비교와 체크아웃뿐이라 조상이 필요 없다.
      # 결과 파일이 main 에서도 바뀌었으면 어느 쪽이 맞는지 알 수 없으므로 덮어쓰지 않고 실패한다.
      # PDF 는 바로 위 단계에서 아티팩트로 올라가 있다.
      - name: Move onto the latest main before committing
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/$GITHUB_REF_NAME"
          base=$(git rev-parse HEAD)
          latest=$(git rev-parse FETCH_HEAD)
          if [ "$latest" = "$base" ]; then
            echo "$GITHUB_REF_NAME has not moved since checkout ($base)."
            exit 0
          fi
          # 패턴을 셸이 펼치지 않고 git 에 그대로 넘긴다. main 에만 있는 파일도 비교에 들어간다.
          set -f
          changed=$(git diff --name-only "$base" "$latest" -- $REPORT_COMMIT_FILES)
          set +f
          if [ -n "$changed" ]; then
            echo "::error::$GITHUB_REF_NAME changed files this run commits since the run started: $(echo $changed). Not committing over them. Check those commits, then run publish-report again for the same dates; the PDFs are in this run's artifacts."
            exit 1
          fi
          kept=$(mktemp -d)
          for file in $REPORT_COMMIT_FILES; do
            if [ -e "$file" ]; then cp --parents -- "$file" "$kept/"; fi
          done
          # 브랜치와 추적 설정은 그대로 두고 main 의 마지막 커밋으로 옮긴다. 결과 파일 밖의 작업 트리 변경은 커밋하지 않으므로 버린다.
          git reset --hard "$latest"
          cp -R "$kept/." .
          echo "Moved from $base to $latest; result files carried over:"
          git status --short -- $REPORT_COMMIT_FILES
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update company signals and bilingual reports"
          file_pattern: ${{ env.REPORT_COMMIT_FILES }}
